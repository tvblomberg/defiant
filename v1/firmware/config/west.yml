manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    # Full path from the repo root, not just "config". ZMK's build-user-config
    # workflow assumes the west topdir is the repo root; west derives topdir by
    # stripping this path off the manifest dir, so a bare "config" would put the
    # workspace at v1/firmware/ and the workflow would look for zmk/ and zephyr/
    # in the wrong place.
    path: v1/firmware/config
